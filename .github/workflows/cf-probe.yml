name: Cloudflare probe
# Lists the NAMES of the secrets this repository exposes (never the values), plainly and per environment.
on:
  workflow_dispatch:
  push:
    branches: [alieni-cloudflare]
    paths: [".github/workflows/cf-probe.yml"]
permissions:
  contents: read
jobs:
  names:
    strategy:
      fail-fast: false
      matrix:
        env: ["", "production", "Production", "cloudflare", "Cloudflare", "preview", "Preview"]
    runs-on: ubuntu-latest
    environment: ${{ matrix.env }}
    steps:
      - name: Secret and variable names
        env:
          ALL: ${{ toJSON(secrets) }}
          VARS: ${{ toJSON(vars) }}
        run: |
          echo "environment: '${{ matrix.env }}'"
          echo "secrets: $(echo "$ALL" | jq -r 'keys | join(", ")')"
          echo "variables: $(echo "$VARS" | jq -r 'keys | join(", ")')"
