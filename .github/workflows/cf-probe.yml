name: Cloudflare probe
# Lists the NAMES of the repository/organisation secrets and variables (never the values).
on:
  workflow_dispatch:
  push:
    branches: [alieni-cloudflare]
    paths: [".github/workflows/cf-probe.yml"]
permissions:
  contents: read
jobs:
  names:
    runs-on: ubuntu-latest
    steps:
      - name: Secret and variable names
        env:
          ALL: ${{ toJSON(secrets) }}
          VARS: ${{ toJSON(vars) }}
        run: |
          echo "secrets: $(echo "$ALL" | jq -r 'keys | join(", ")')"
          echo "variables: $(echo "$VARS" | jq -r 'keys | join(", ")')"
