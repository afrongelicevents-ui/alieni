name: Deploy to Cloudflare (alieni-cloudflare)

# Free Cloudflare plan only: Workers (workers.dev), D1, R2, one cron trigger.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see docs/CLOUDFLARE.md).
# Optional secret: RESEND_API_KEY (turns on e-mail confirmation and e-mails); optional variable: EMAIL_FROM.
on:
  push:
    branches: [alieni-cloudflare]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: node scripts/check-i18n.cjs

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CI: "true"
    steps:
      - name: Keys present?
        id: keys
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not set as repository secrets; nothing deployed. See docs/CLOUDFLARE.md."
            echo "### Not deployed: Cloudflare keys missing (see docs/CLOUDFLARE.md)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.keys.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.keys.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - if: steps.keys.outputs.ready == 'true'
        run: npm ci

      - name: workers.dev address
        if: steps.keys.outputs.ready == 'true'
        id: sub
        run: |
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty')
          if [ -z "$SUB" ]; then
            echo "::error::This Cloudflare account has no workers.dev subdomain yet. Open Cloudflare → Workers & Pages once (it asks you to pick one), then re-run this workflow."
            exit 1
          fi
          echo "url=https://alieni.$SUB.workers.dev" >> "$GITHUB_OUTPUT"

      - name: D1 database (create once)
        if: steps.keys.outputs.ready == 'true'
        run: |
          ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="alieni") | .uuid')
          if [ -z "$ID" ]; then
            npx wrangler d1 create alieni --location weur
            ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="alieni") | .uuid')
          fi
          [ -n "$ID" ] || { echo "::error::could not find or create the D1 database"; exit 1; }
          sed -i "s/00000000-0000-0000-0000-000000000000/$ID/" wrangler.jsonc

      - name: R2 bucket (create once, private)
        if: steps.keys.outputs.ready == 'true'
        run: |
          if ! npx wrangler r2 bucket list | grep -q "name:\s*alieni-files$"; then
            npx wrangler r2 bucket create alieni-files --location weur
          fi

      - name: Database migrations
        if: steps.keys.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply alieni --remote

      - name: Build (OpenNext)
        if: steps.keys.outputs.ready == 'true'
        run: npx opennextjs-cloudflare build

      - name: Deploy
        if: steps.keys.outputs.ready == 'true'
        env:
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
        run: |
          EXTRA=()
          [ -n "$EMAIL_FROM" ] && EXTRA=(--var "EMAIL_FROM:$EMAIL_FROM")
          npx wrangler deploy --var "BETTER_AUTH_URL:${{ steps.sub.outputs.url }}" "${EXTRA[@]}"

      - name: Secrets (made once, kept in Cloudflare)
        if: steps.keys.outputs.ready == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          have=$(npx wrangler secret list --format json | jq -r '.[].name')
          for s in BETTER_AUTH_SECRET CRON_SECRET; do
            if ! grep -qx "$s" <<<"$have"; then openssl rand -hex 32 | npx wrangler secret put "$s"; fi
          done
          if [ -n "$RESEND_API_KEY" ]; then printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY; fi

      - name: Test data (only into an empty database)
        if: steps.keys.outputs.ready == 'true'
        env:
          # Chosen by the owner and stored as a GitHub secret; it is never printed. Without it, no admin is created.
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
        run: |
          USERS=$(npx wrangler d1 execute alieni --remote --json --command 'SELECT count(*) AS n FROM "user"' | jq -r '.[0].results[0].n')
          if [ "$USERS" = "0" ]; then
            node scripts/seed.mjs --out seed.sql
            npx wrangler d1 execute alieni --remote --file seed.sql
            rm seed.sql
            {
              echo "### Test data added"
              echo "Test logins: see docs/CLOUDFLARE.md."
              if [ -n "$SEED_ADMIN_PASSWORD" ]; then echo "Admin: admin@alieni.test with the SEED_ADMIN_PASSWORD you chose."; else echo "No admin account created: add the SEED_ADMIN_PASSWORD secret before the first deploy (docs/CLOUDFLARE.md)."; fi
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Database already has $USERS users: test data not added again."
          fi

      - name: Smoke test
        if: steps.keys.outputs.ready == 'true'
        run: |
          URL="${{ steps.sub.outputs.url }}"
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/nl") && [ "$code" = "200" ] && break; sleep 10
          done
          echo "GET /nl → $code"; [ "$code" = "200" ]
          curl -sf "$URL/api/me" | grep -q '"guest"'
          echo "### Live: $URL" >> "$GITHUB_STEP_SUMMARY"
